version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: 'Block #1'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - checkout
            - cd 2-docker-build/
            - echo $DOCKER_PASSWORD | docker login --username "$DOCKER_USERNAME" --password-stdin
            - docker build -t app123 .
            - docker tag app123 "$DOCKER_USERNAME"/app123
            - docker push "$DOCKER_USERNAME"/app123
      secrets:
        - name: Dockerhub
